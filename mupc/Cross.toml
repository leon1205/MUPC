# Cross.toml — 交叉编译配置 (cross-rs)
#
# 用法: cross build -p mupc-core-bin --release --target aarch64-unknown-linux-gnu --features npu
#
# 前置条件:
#   cargo install cross
#   或 docker / podman 可用

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update && apt-get install -y libssl-dev:arm64 libsqlite3-dev:arm64 || true",
]

[build.env]
passthrough = [
    "RKNN_VENDOR_DIR",
    "RKNN_SDK_ROOT",
    "CARGO_FEATURE_NPU",
]

# 若 RKNN .so 不在 vendor/rknn/ 中，设置 RKNN_VENDOR_DIR:
# [build.env]
# passthrough = ["RKNN_VENDOR_DIR", "RKNN_SDK_ROOT", "CARGO_FEATURE_NPU"]
