# MUPC 主控进程配置文件
# 安装路径: /opt/mupc/config/mupc_core_config.yaml
# mupcd 通过 --config 参数指定此文件路径

version: "1.0"

system:
  log_level: "info"              # info / debug / warn / error
  log_dir: "/opt/mupc/logs"
  data_dir: "/opt/mupc/data"
  plugin_dir: "/opt/mupc/lib/plugins"
  cert_dir: "/opt/mupc/certs"
  shutdown_timeout_sec: 30

intercore:
  transport: "tcp"              # "tcp" | "modbus_rtu"（生产 PCS 主链路=modbus_rtu；tcp 仅供仿真/联调）
  host: "192.168.1.2"           # 实时核心 IP（tcp 通道）
  port: 9100
  heartbeat_interval_sec: 5
  reconnect_interval_sec: 3
  modbus_rtu:                   # modbus_rtu 通道参数
    serial_port: "/dev/ttyS0"   # BECG COM1(ttyS0) ↔ PCS（§12.1；无 ttyS1）
    baud_rate: 19200
    data_bits: 8
    stop_bits: 1
    parity: "none"              # none / even / odd
    slave_addr: 1
    response_timeout_ms: 200
    heartbeat_poll_ms: 1000

# 【单元 K 已删除 `web_api:` 段】对外 HTTP 面（0.0.0.0:8080）随 `mupc-web-api` crate 整体移除，
# 由本地触摸屏 HMI 取代（见 12-本地显示终端 设计 §7）。现场**既有**的带 `web_api:` 段的 yaml
# 仍可正常加载（未建模段被忽略），且保存配置时**逐字保留**——不强制运维立即改文件。

# 本地显示终端（12-本地显示终端 设计 §4.9 / §7.3 `display:` 段；mupcd 装配读通道 +
# 控制通道 + `hmi_backend` 服务注册）。**字段真源 = 契约** `display-proto::DisplayConfig`。
# 【本份 enabled=false 的理由】本文件是仓库默认（intercore.transport=tcp，供仿真/联调）；
#   设计 §7.3 只要求**生产模板**开启（`.production.yaml` 已置 true），故此处保持 false——
#   整段跳过，部署行为与升级前一致（本份用途不是屏上机）。
#   ⚠️ 现场屏上机：置 true。**置 true 后**下列字段**全量**过契约 `validate()`，任一项不合规
#   ⇒ mupcd **启动失败**（fail-fast；核对清单见 `deploy/deploy.md` §十）。地址只认**字面量**
#   回环 `127.0.0.1` / `::1`（`localhost` 等名字一律拒——名字可经 hosts 重映射，PL-4 安全红线），
#   端口 ∈ [1,65535]，且**两条地址不得相同**。
display:
  enabled: false                        # 生产模板 .production.yaml 为 true
  bind_addr: "127.0.0.1:9810"           # 读通道（回环发布最新帧）
  control_bind_addr: "127.0.0.1:9811"   # 控制通道（T-3 无登录写通道 → 硬绑回环）
  publish_ms: 1000                      # 主拍周期（须 >= 100）
  min_publish_interval_ms: 250          # 变更即组帧合并窗口（须 ∈ [100, publish_ms]）
  device_poll_ms: 3000                  # 慢拍 A 装置状态（须 ∈ [1,4000]；F6.3 ≤5 s 前提）
  alarm_poll_ms: 500                    # 慢拍 B 告警（须 ∈ [1,1000]；F7.3 ≤2 s 前提）
  interlock_poll_ms: 500                # 慢拍 C 联锁（须 ∈ [1,1000]；F16.5 ≤2 s 前提）
  alarm_page_size: 10                   # F7 告警列表最多展示条数（不得为 0）
  log:                                  # 控制通道日志检索限额（EDGE-15）
    max_files: 5
    max_lines: 50000
    live_ring: 2000                     # 实时日志 ring 容量（须 >= 100）
    page_limit_max: 200
    audit_page_size: 20
  range:                                # 域值化量程（PRD §6.5 越界判 RangeError）
    current_max_a: 300.0                # 五个数值均须有限正数（禁 NaN/±Inf/0/负数）
    phase_power_max_kw: 100.0           # 须 <= total_power_max_kw
    total_power_max_kw: 300.0
    pcs_total_rated_kw: 60.0
    inconsistency_threshold_kw: 3.0     # 须 <= pcs_total_rated_kw（超额定 ⇒ 角标恒灭）

# IEC 104 北向网关监听（S2 §12.3 gateway 段；缺省 0.0.0.0:2404，与历史硬编码一致）
# ⚠️ 本段**必须存在**：保留式编辑只做"行级替换"，段缺失会让该段字段的首次写入整体回写
#    （WriteMode=FullRewrite）⇒ 本文件全部注释丢失（详见 yaml_edit.rs 模块头的边界登记）。
# 投产口径：listen_addr 填调度主站可达的本机网口（如 "192.168.3.10"），端口按主站约定。
gateway:
  listen_addr: "0.0.0.0"        # 缺省 0.0.0.0（全网口）；投产建议按现场网口收紧
  listen_port: 2404             # IEC 60870-5-104 标准端口

ai_engine:
  model_dir: "/opt/mupc/models"
  config_file: "/opt/mupc/config/mupc_env_config.yaml"
  enable_npu: true               # 是否启用 RK3588 NPU
  inference_timeout_ms: 500
  # 部署默认：本地策略优先（本地台区储能治理策略控制，AI 旁路参考不下发）
  # 需 AI 智能控制时置 false（单元 K 后**无**运行时切换端点：原 Web API 出口已随 crate 删除）
  local_priority: true  # AI 暂停期恒 true（平台目标调整 2026-09-09，观测空间维度重构前禁止置 false）

plugins:
  search_paths:
    - "/opt/mupc/lib/plugins"
  auto_load:
    - "rs485_plugin"
    - "hplc_plugin"
    - "mqtt_plugin"

# 策略引擎配置（v2.24 容量档位 §2.10.2）
# tai_config_file 指向档位 YAML；空 = 默认档 pcs60_dual（60kW 双级式，唯一向后兼容分支）。
# 换 PCS 规格：改档位 YAML 顶行 capacity_profile key 或直接换文件，不需改代码。
strategy:
  tai_config_file: ""
  # ⚠️ 非 60kW 档（如 125kVA）放行须与 intercore transport 驱动点表型号同批变更
  #    并装配期核对（§2.10.2 M-1）；has_neutral=true 档当前在档位加载侧被拦截。

# 数字 IO / 安全联锁（§12.4；BECG-3568 板载 DI/DO，GPIO 编号按规格书、现场校准）
# 默认全注释关闭：未配置 io: 段部署行为不变（enabled=false 跳过联锁与校验）。
# 启用 = 去掉下方注释并按板端实际 /sys/class/gpio 校准编号（deploy §九 9.2）。
# io:
#   enabled: true
#   poll_ms: 100
#   auto_release: false          # false = 须本地屏（P4）人工解除（K 后无 Web 面）
#   release_hold_secs: 5
#   stop_confirm_ms: 5000        # ⚠️ 须 ≥ 2× intercore.modbus_rtu.heartbeat_poll_ms（停机确认依赖心跳报 1013）
#   di:
#     - { name: "急停",     gpio: 124, active_low: true,  debounce: 1, action: pcs_stop }   # NC 断线触发
#     - { name: "水浸",     gpio: 125, active_low: false, debounce: 1, action: pcs_stop }
#     - { name: "消防报警", gpio: 102, active_low: false, debounce: 1, action: pcs_stop }
#     - { name: "门禁",     gpio: 103, active_low: false, debounce: 3, action: event }
#   do:
#     - { name: "运行灯", gpio: 97,  active_high: true }   # do_out[0]=运行灯、[1]=故障灯（控制器按索引）
#     - { name: "故障灯", gpio: 107, active_high: true }

# 站级南向统一调度（S3 §10.3 south_stations 段；mupc-southd 装配）
# 【收敛】总表 phase 真源唯一走下方 grid_meter 站——master_meter 段已删除（S3b-1c），
# serde 不再解析该字段，配置了也不生效。meter_grid 的 regs 是语义契约且配置期校验
# （mupc-southd SouthStationsConfig::validate，S3b-1c）：块名 mapper 按名查找，相量块
# p/q/pf/u/i 各须存在且 count:6（3 相×2 寄存器三相连续）、addr>0、半开区间不重叠，
# p_total 可选 count:2——缺失/addr=0/区间重叠的 meter_grid 启动校验即报错（防 typo 静默
# 读到错寄存器喂策略 / phase 断供才离线发现）。
# 其余站（bms/空调/储能表/消防）非 meter_grid：S3a 采通用 telemetry（regs 留空不影响在线），
# 语义点表待厂方 → S3b-2 补全，暂保持注释。⚠️ 各站串口不得与 intercore（PCS 主链路）同口
# （RS485 总线仲裁未实现）。
south_stations:
  poll_ms: 1000
  stale_timeout_s: 5
  stations:
    # 关口/台区总表 = 策略 phase 真源（interval_ms 须 < 5000）。addr 为示例占位（0x1000 基址，
    # 承已删 master_meter.reg_map 的相对布局 0x0006 步进），投运前须按总表厂方真实点表校准
    # addr/format/scale/count——注意须 addr>0 且块间不重叠（0 起会拒启动）。
    - id: grid_meter
      role: meter_grid
      port: "/dev/ttyS4"          # BECG COM4(ttyS4) ↔ 关口/台区总表（§12.1）；⚠️ 须与 intercore 串口不同
      baud_rate: 9600             # 同口多从站须一致（物理共享口波特率）
      protocol: modbus
      slave: 3
      interval_ms: 1000           # 须 < 5000（策略 phase 周期约束）
      regs:                       # 三相连续，Int32/Float32 均 2 寄存器/相；count=块寄存器数
        - { name: p,       addr: 0x1000, format: int32_scaled, scale: 0.01, count: 6 }   # P_A/B/C
        - { name: q,       addr: 0x1006, format: int32_scaled, scale: 0.01, count: 6 }   # Q_A/B/C
        - { name: pf,      addr: 0x100C, format: int32_scaled, scale: 0.001, count: 6 }  # PF_A/B/C
        - { name: u,       addr: 0x1012, format: float32,       scale: 1.0,  count: 6 }  # U_A/B/C（float32 不乘 scale）
        - { name: i,       addr: 0x1018, format: int32_scaled, scale: 0.01, count: 6 }   # I_A/B/C
        - { name: p_total, addr: 0x101E, format: int32_scaled, scale: 0.01, count: 2 }   # 可选：缺省降级 Σp
    # S3b-2 语义点表未到，以下站暂注释；启用前按现场校准串口/从站（对齐 BECG §12.1 接线）。
    # battery 站配 soc 块（name: soc）后，SOC 经 on_battery_soc 独立通道推 AiIntegrator
    # （BMS 源优先，超期回落核间，04 §2.11.1）——厂方语义点表（S3b-2）配好后生效。
    # - { id: bms,         role: battery,    port: "/dev/ttyS2", protocol: modbus, slave: 1, interval_ms: 1000 }
    # - { id: ac_unit,     role: hvac,       port: "/dev/ttyS3", protocol: modbus, slave: 1, interval_ms: 5000 }
    # - { id: meter_batt,  role: meter_batt, port: "/dev/ttyS5", protocol: modbus, slave: 1, interval_ms: 1000 }
    # - { id: fire_host,   role: fire,       port: "/dev/ttyS6", protocol: modbus, slave: 1, interval_ms: 1000 }
