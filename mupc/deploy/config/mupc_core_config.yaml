# MUPC 主控进程配置文件
# 安装路径: /opt/mupc/config/mupc_core_config.yaml
# mupcd 通过 --config 参数指定此文件路径

version: "1.0"

system:
  log_level: "info"              # info / debug / warn / error
  log_dir: "/opt/mupc/logs"
  data_dir: "/opt/mupc/data"
  plugin_dir: "/opt/mupc/lib/plugins"
  cert_dir: "/opt/mupc/certs"
  shutdown_timeout_sec: 30

intercore:
  transport: "tcp"              # "tcp" | "modbus_rtu"（生产 PCS 主链路=modbus_rtu；tcp 仅供仿真/联调）
  host: "192.168.1.2"           # 实时核心 IP（tcp 通道）
  port: 9100
  heartbeat_interval_sec: 5
  reconnect_interval_sec: 3
  modbus_rtu:                   # modbus_rtu 通道参数
    serial_port: "/dev/ttyS0"   # BECG COM1(ttyS0) ↔ PCS（§12.1；无 ttyS1）
    baud_rate: 19200
    data_bits: 8
    stop_bits: 1
    parity: "none"              # none / even / odd
    slave_addr: 1
    response_timeout_ms: 200
    heartbeat_poll_ms: 1000

web_api:
  listen_addr: "0.0.0.0:8080"
  enable_https: false            # Phase 2+ 启用
  # tls_cert: "/opt/mupc/certs/server.crt"
  # tls_key: "/opt/mupc/certs/server.key"

ai_engine:
  model_dir: "/opt/mupc/models"
  config_file: "/opt/mupc/config/mupc_env_config.yaml"
  enable_npu: true               # 是否启用 RK3588 NPU
  inference_timeout_ms: 500
  # 部署默认：本地策略优先（本地台区储能治理策略控制，AI 旁路参考不下发）
  # 需 AI 智能控制时置 false 或经 Web API /api/v1/strategy-mode 运行时切换
  local_priority: true

plugins:
  search_paths:
    - "/opt/mupc/lib/plugins"
  auto_load:
    - "rs485_plugin"
    - "hplc_plugin"
    - "mqtt_plugin"

# 策略引擎配置（v2.24 容量档位 §2.10.2）
# tai_config_file 指向档位 YAML；空 = 默认档 pcs60_dual（60kW 双级式，唯一向后兼容分支）。
# 换 PCS 规格：改档位 YAML 顶行 capacity_profile key 或直接换文件，不需改代码。
strategy:
  tai_config_file: ""
  # ⚠️ 非 60kW 档（如 125kVA）放行须与 intercore transport 驱动点表型号同批变更
  #    并装配期核对（§2.10.2 M-1）；has_neutral=true 档当前在档位加载侧被拦截。

# 数字 IO / 安全联锁（§12.4；BECG-3568 板载 DI/DO，GPIO 编号按规格书、现场校准）
# 默认全注释关闭：未配置 io: 段部署行为不变（enabled=false 跳过联锁与校验）。
# 启用 = 去掉下方注释并按板端实际 /sys/class/gpio 校准编号（deploy §九 9.2）。
# io:
#   enabled: true
#   poll_ms: 100
#   auto_release: false          # false = 须 Web 人工解除
#   release_hold_secs: 5
#   stop_confirm_ms: 5000        # ⚠️ 须 ≥ 2× intercore.modbus_rtu.heartbeat_poll_ms（停机确认依赖心跳报 1013）
#   di:
#     - { name: "急停",     gpio: 124, active_low: true,  debounce: 1, action: pcs_stop }   # NC 断线触发
#     - { name: "水浸",     gpio: 125, active_low: false, debounce: 1, action: pcs_stop }
#     - { name: "消防报警", gpio: 102, active_low: false, debounce: 1, action: pcs_stop }
#     - { name: "门禁",     gpio: 103, active_low: false, debounce: 3, action: event }
#   do:
#     - { name: "运行灯", gpio: 97,  active_high: true }   # do_out[0]=运行灯、[1]=故障灯（控制器按索引）
#     - { name: "故障灯", gpio: 107, active_high: true }

# 台区总表分相数据源（U-26：台区储能策略 phase 输入）
# enabled: true 并填真实点表（reg_map 各量起始寄存器）后方启用；默认关
master_meter:
  enabled: false
  serial_port: "/dev/ttyS4"     # BECG COM4(ttyS4) ↔ 关口/台区总表（§12.1）
  baud_rate: 9600
  slave_addr: 3
  read_interval_ms: 1000
  reg_map:                 # 示例占位地址；三相连续，Int32/Float32 均 2 寄存器/相
    p:  { addr: 0x0000, format: int32_scaled, scale: 0.01 }   # P_A/B/C
    q:  { addr: 0x0006, format: int32_scaled, scale: 0.01 }   # Q_A/B/C
    pf: { addr: 0x000C, format: int32_scaled, scale: 0.001 }  # PF_A/B/C
    u:  { addr: 0x0012, format: float32 }                     # U_A/B/C
    i:  { addr: 0x0018, format: int32_scaled, scale: 0.01 }   # I_A/B/C
    p_total: { addr: 0x001E, format: int32_scaled, scale: 0.01 }

# 站级南向统一调度（S3 §10.3 south_stations 段；mupc-southd 装配）
# 收敛目标：master_meter 段最终删除，总表改走下方 meter_grid 站（策略 phase 真源，替代
# read_master_meter 硬编码 task）。迁移期二选一（core_config validate R-H）：启用
# south_stations.meter_grid 前须置 master_meter.enabled=false，否则启动校验报错。
# 默认全注释关闭：未配置 south_stations 段行为不变（走 master_meter/pv-load 硬编码）。
# 启用 = 去掉下方注释并按现场实际校准串口/从站；例中对齐 BECG §12.1 接线
# （BMS ttyS2/空调 ttyS3/关口 ttyS4/储能表 ttyS5/消防 ttyS6）。
# ⚠️ 各站串口不得与 intercore（PCS）及 master_meter 同口（RS485 总线仲裁未实现）。
# south_stations:
#   poll_ms: 1000
#   stale_timeout_s: 5
#   stations:
#     # 关口/台区总表 = 策略 phase 真源（替代 master_meter 段；interval_ms 须 < 5000）
#     # ⚠️ meter_grid 的 regs 必填：块名是语义契约（mapper 按名查找，命名不同即整周期失败），
#     #    相量块 p/q/pf/u/i 各须 count:6（3 相×2 寄存器，三相连续），p_total 可选 count:2。
#     #    可照抄下方 master_meter.reg_map（float32 或 int32_scaled+scale 均可，格式随块）——
#     #    但注意收敛后 master_meter 段会删除，届时此处 regs 是唯一参考，迁移前请先在此固化。
#     #    ⚠️ 启用了无 regs（或 regs 缺 p/q/pf/u/i）的 meter_grid = 该站永久 offline，
#     #    且 pv/load 南向兜底被关（grid_on 仅看是否配置了 grid 站），策略 phase 断供——务必配全再启用。
#     - id: grid_meter
#       role: meter_grid
#       port: "/dev/ttyS4"
#       protocol: modbus
#       slave: 3
#       interval_ms: 1000           # 须 < 5000（策略 phase 周期约束）
#       regs:                       # 示例占位地址；三相连续，Int32/Float32 均 2 寄存器/相
#         - { name: p,       addr: 0x0000, format: int32_scaled, scale: 0.01, count: 6 }   # P_A/B/C
#         - { name: q,       addr: 0x0006, format: int32_scaled, scale: 0.01, count: 6 }   # Q_A/B/C
#         - { name: pf,      addr: 0x000C, format: int32_scaled, scale: 0.001, count: 6 }  # PF_A/B/C
#         - { name: u,       addr: 0x0012, format: float32,       scale: 1.0,  count: 6 }  # U_A/B/C
#         - { name: i,       addr: 0x0018, format: int32_scaled, scale: 0.01, count: 6 }   # I_A/B/C
#         - { name: p_total, addr: 0x001E, format: int32_scaled, scale: 0.01, count: 2 }   # 可选：缺省降级 Σp
#     # 以下站非 meter_grid：S3a 采通用 telemetry（regs 留空即可，不影响站在线），
#     # 语义点表待厂方 → S3b 补全（battery 含 soc 块则填 battery.soc）。
#     - { id: bms,         role: battery,    port: "/dev/ttyS2", protocol: modbus, slave: 1, interval_ms: 1000 }
#     - { id: ac_unit,     role: hvac,       port: "/dev/ttyS3", protocol: modbus, slave: 1, interval_ms: 5000 }
#     - { id: meter_batt,  role: meter_batt, port: "/dev/ttyS5", protocol: modbus, slave: 1, interval_ms: 1000 }
#     - { id: fire_host,   role: fire,       port: "/dev/ttyS6", protocol: modbus, slave: 1, interval_ms: 1000 }
