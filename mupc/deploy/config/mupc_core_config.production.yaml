# MUPC 主控进程配置文件 —— 【生产模板】（PCS 真实协议主链路）
# 用途：现场部署时复制为 /opt/mupc/config/mupc_core_config.yaml，并按现场实际
#       填写串口/从站地址（EMS 接 PCS A2/B2，RS485 19200 N-8-1）。
# 对照：仓库默认 mupc_core_config.yaml 的 intercore.transport=tcp 仅供仿真/联调
#       （sim-bridge 作 TCP 服务端）；生产必须 transport=modbus_rtu 直连 PCS，
#       否则 PCS 永不被控（空连 TCP 9100）。mupcd 通过 --config 指定此文件路径。

version: "1.0"

system:
  log_level: "info"              # info / debug / warn / error
  log_dir: "/opt/mupc/logs"
  data_dir: "/opt/mupc/data"
  plugin_dir: "/opt/mupc/lib/plugins"
  cert_dir: "/opt/mupc/certs"
  shutdown_timeout_sec: 30

intercore:
  transport: "modbus_rtu"       # 【生产】modbus_rtu → 两级式 PCS（实时控制模块）
  host: "192.168.1.2"           # (tcp 仿真专用，modbus_rtu 下不使用)
  port: 9100
  heartbeat_interval_sec: 5
  reconnect_interval_sec: 3
  modbus_rtu:                   # modbus_rtu 通道参数（PCS 协议 V1.3 线格式）
    serial_port: "/dev/ttyS0"   # BECG COM1(ttyS0) ↔ PCS（§12.1）；⚠️ 现场按实际 RS485 口修改
    baud_rate: 19200
    data_bits: 8
    stop_bits: 1
    parity: "none"              # none / even / odd
    slave_addr: 1               # PCS 从站地址（拨码，默认 1）
    response_timeout_ms: 200
    heartbeat_poll_ms: 1000

# 【单元 K 已删除 `web_api:` 段】对外 HTTP 面（0.0.0.0:8080）随 `mupc-web-api` crate 整体移除，
# 由本地触摸屏 HMI 取代（见 12-本地显示终端 设计 §7）。现场**既有**的带 `web_api:` 段的 yaml
# 仍可正常加载（未建模段被忽略），且保存配置时**逐字保留**——不强制运维立即改文件。

# 本地显示终端（12-本地显示终端 设计 §4.9 / §7.3 `display:` 段；mupcd 装配读通道 +
# 控制通道 + `hmi_backend` 服务注册）。**字段真源 = 契约** `display-proto::DisplayConfig`。
# 【生产】`enabled: true`（设计 §7.3「`.production.yaml` 同上 + 开启 `display.enabled: true`」）
#   ⇒ 本机触摸屏 HMI 的读通道 / 控制通道随 mupcd 启动，`hmi_backend` 在册。
#   ⚠️ 置 true 后下列字段**全量**过契约 `validate()`，任一项不合规 ⇒ mupcd **启动失败**
#   （fail-fast；核对清单见 `deploy/deploy.md` §十）。地址只认**字面量**回环 `127.0.0.1` / `::1`
#   （`localhost` 等名字一律拒——名字可经 hosts 重映射，PL-4 安全红线），端口 ∈ [1,65535]，
#   且**两条地址不得相同**。
display:
  enabled: true                         # 【生产】启用本地 HMI 后端（读 + 控制）
  bind_addr: "127.0.0.1:9810"           # 读通道（回环发布最新帧）
  control_bind_addr: "127.0.0.1:9811"   # 控制通道（T-3 无登录写通道 → 硬绑回环）
  publish_ms: 1000                      # 主拍周期（须 ∈ [100,4000]，实际须 ≥250）
  min_publish_interval_ms: 250          # 变更即组帧合并窗口（须 ∈ [250, publish_ms]）
  device_poll_ms: 3000                  # 慢拍 A 装置状态（须 ∈ [1,4000]；F6.3 ≤5 s 前提）
  alarm_poll_ms: 500                    # 慢拍 B 告警（须 ∈ [1,1000]；F7.3 ≤2 s 前提）
  interlock_poll_ms: 500                # 慢拍 C 联锁（须 ∈ [1,1000]；F16.5 ≤2 s 前提）
  alarm_page_size: 10                   # F7 告警列表最多展示条数（不得为 0）
  log:                                  # 控制通道日志检索限额（EDGE-15）
    max_files: 5
    max_lines: 50000
    live_ring: 2000                     # 实时日志 ring 容量（须 >= 100）
    page_limit_max: 200
    audit_page_size: 20
  range:                                # 域值化量程（PRD §6.5 越界判 RangeError）
    current_max_a: 300.0                # 五个数值均须有限正数（禁 NaN/±Inf/0/负数）
    phase_power_max_kw: 100.0           # 须 <= total_power_max_kw
    total_power_max_kw: 300.0
    pcs_total_rated_kw: 60.0
    inconsistency_threshold_kw: 3.0     # 须 <= pcs_total_rated_kw（超额定 ⇒ 角标恒灭）

# 存储运行参数（03 设计 §9.2 / PRD §11.3，U-67）。**进 YAML、不进 DB**，**重启生效**。
# 三值即本段**全部**内容（PRD R-11.3-A：本段只含三键，不含保留期 / max_retained_points）。
# ⚠️ 合法范围（越界**拒启动**，错误信息点名键，PRD R-11.3-E）：
#   batch_capacity            ∈ [1, 100000]
#   flush_interval_ms         ∈ [100, 600000]（**禁 0**）
#   grid_aggregate_period_ms  ∈ [10000, 3600000] 且须为 1000 的整数倍
# 下面三个值 = **缺省值**（不写本段也等价）：与变更前的硬编码逐字相同 ⇒ 零行为变化。
storage:
  batch_capacity: 1000              # 遥测写缓冲批量提交容量（条）
  flush_interval_ms: 5000           # 遥测写缓冲提交间隔（ms）
  grid_aggregate_period_ms: 60000   # 总表电气量聚合落库周期（ms；60000 = 1 分钟）

# IEC 104 北向网关监听（S2 §12.3 gateway 段；缺省 0.0.0.0:2404，与历史硬编码一致）
# ⚠️ 本段**必须存在**：保留式编辑只做"行级替换"，段缺失会让该段字段的首次写入整体回写
#    （WriteMode=FullRewrite）⇒ 本文件全部注释丢失（详见 yaml_edit.rs 模块头的边界登记）。
# 【生产】投产口径：listen_addr 填调度主站可达的本机网口（如 "192.168.3.10"），
#   端口按主站约定（默认 2404）。改此二键 requires_reconnect=true ⇒ 屏上 L2+ 强确认。
gateway:
  listen_addr: "0.0.0.0"        # 缺省 0.0.0.0（全网口）；投产**建议**按现场网口收紧
  listen_port: 2404             # IEC 60870-5-104 标准端口（按调度主站约定）

# ── 北向/本地 MQTT（01 设计 §9.3.2，U-71）──
# 【生产】⚠️ 本段**必须存在**（保留式编辑：段缺失会让该段字段的首次写入整体回写 ⇒ 丢注释）。
# 缺省 `enabled: false` ⇒ **零连接尝试**（CFG-2）。**启用前必须**：① 填真实 Broker（host:port）
# 与 client_id；② 投放三件真实证书（CA / 客户端证书 / 私钥）并填绝对路径——**严禁**占位域名
# 或 dummy 证书路径（CFG-3）；③ 保持 `allow_plaintext: false`（生产**禁止**明文，TLS-4）。
# 证书私钥文件权限须限 root 可读；证书剩余 <30 天会在启动/每日检查时产 major 事件（TLS-3）。
# 改本段**重启生效**（无热更新）。
mqtt_bridge:
  enabled: false               # 总开关；false ⇒ 一行连接代码都不执行
  north:
    enabled: false             # ⚠️ 置 true 前须完成上面 ①②③
    broker: ""                 # "host:port"；enabled=true 时不得为空（validate 拒）
    client_id: ""              # 物联平台侧客户端 ID；enabled=true 时不得为空
    username: null             # 可选（按物联平台账号）
    password: null             # 可选；**不进日志/载荷**（建议用只读最小权限账号）
    tls:
      ca_cert: ""              # 【现场填写】CA 证书绝对路径（三路径均须非空且可读）
      client_cert: ""          # 【现场填写】客户端证书（TLS-3 读它的 notAfter 做到期告警）
      client_key: ""           # 【现场填写】客户端私钥（权限限 root）
      allow_plaintext: false   # 生产**必须** false（明文仅限非生产构建 + 显式开关，Q9/TLS-4）
    topic_prefix: "mupc/north" # 分片主题前缀：{prefix}/telemetry/{station}、{prefix}/event/{station}
    qos: 1                     # 0..=2（故障类事件走 event 主题 QoS2）
    periods:
      a_ms: 1000               # A 档周期（100..=60000）
      b_ms: 5000               # B 档周期（a_ms..=600000）
      cos_merge_ms: 200        # C 档 COS 合并窗（1..=1000；保「变化后 ≤1 s 发出」）
    cache:
      max_age_s: 1800          # 断线缓存时间窗（≥60；内存态，掉电即丢，PRD Q7 ①）
      max_messages: 10000      # 条数上限（≥100）；与 max_age_s **先到先淘汰**
  local:
    enabled: false             # 本地 mosquitto（进程间）分向开关
    broker: "127.0.0.1:1883"
    client_id: "mupc-local"

ai_engine:
  model_dir: "/opt/mupc/models"
  config_file: "/opt/mupc/config/mupc_env_config.yaml"
  enable_npu: true               # 是否启用 RK3588 NPU
  inference_timeout_ms: 500
  # 部署默认：本地策略优先（本地台区储能治理策略控制，AI 旁路参考不下发）
  # 需 AI 智能控制时置 false（单元 K 后**无**运行时切换端点：原 Web API 出口已随 crate 删除）
  local_priority: true  # AI 暂停期恒 true（平台目标调整 2026-09-09，观测空间维度重构前禁止置 false）

plugins:
  search_paths:
    - "/opt/mupc/lib/plugins"
  auto_load:
    - "rs485_plugin"
    - "hplc_plugin"

# 策略引擎配置（v2.24 容量档位 §2.10.2）
# 【生产】默认空 = pcs60_dual（60kW 双级式，与 modbus_rtu PCS V1.3 驱动点表匹配）；
# 换 PCS 型号时须同时核对 intercore transport 驱动点表（§2.10.2 M-1），
# 125kVA 等带中线档当前被档位加载校验拦截（待厂方点表 + 仲裁扩展）。
strategy:
  tai_config_file: ""

# 数字 IO / 安全联锁（§12.4；BECG-3568 板载 DI/DO，GPIO 编号按规格书、现场校准）
# 默认全注释关闭：未配置 io: 段部署行为不变（enabled=false 跳过联锁与校验）。
# 启用 = 去掉下方注释并按板端实际 /sys/class/gpio 校准编号（deploy §九 9.2）。
# ⚠️【生产】PCS 硬急停第二副接点兜底：MUPC 软停（500=0）仅为第一层（B1），
#     PCS 侧须有按钮第二副接点直连的独立硬急停干接点回路，现场核对（deploy §九）。
# io:
#   enabled: true
#   poll_ms: 100
#   auto_release: false          # false = 须本地屏（P4）人工解除（K 后无 Web 面）
#   release_hold_secs: 5
#   stop_confirm_ms: 5000        # ⚠️ 须 ≥ 2× intercore.modbus_rtu.heartbeat_poll_ms（停机确认依赖心跳报 1013）
#   di:
#     - { name: "急停",     gpio: 124, active_low: true,  debounce: 1, action: pcs_stop }   # NC 断线触发
#     - { name: "水浸",     gpio: 125, active_low: false, debounce: 1, action: pcs_stop }
#     - { name: "消防报警", gpio: 102, active_low: false, debounce: 1, action: pcs_stop }
#     - { name: "门禁",     gpio: 103, active_low: false, debounce: 3, action: event }
#   do:
#     - { name: "运行灯", gpio: 97,  active_high: true }   # do_out[0]=运行灯、[1]=故障灯（控制器按索引）
#     - { name: "故障灯", gpio: 107, active_high: true }

# 站级南向统一调度（S3 §10.3 south_stations 段；mupc-southd 装配）
# 【生产·收敛】总表 phase 真源唯一走下方 grid_meter 站——master_meter 段已删除（S3b-1c），
# serde 不再解析该字段，配置了也不生效（此前 enabled:true 会被静默忽略 → grid 源消失落
# pv/load 兜底，危险）。meter_grid 的 regs 是语义契约且配置期校验（mupc-southd
# SouthStationsConfig::validate，S3b-1c）：块名 mapper 按名查找，相量块 p/q/pf/u/i 各须存在
# 且 count:6（3 相×2 寄存器三相连续）、addr>0、半开区间不重叠，p_total 可选 count:2——
# 缺失/addr=0/区间重叠的 meter_grid 启动校验即报错（防 typo 静默错读 / 断供才离线发现）。
# 【生产·S3b-2 站级语义点表】已按 PRD §9.4.1 的 6 站参考配置落位（块 = 一次 Modbus 读事务，
# 只承载传输口径与缺省换算；points = 逐点换算口径；站 id 以 §9.4.1 为准）：bms /
# meter_batt / fire / hvac 四站**已启用**；**`pcs` 站保持注释**，待 §9.10 Q-15（PCS 的
# A1/B1 与 A2/B2 是否电气隔离）由现场 RC-8 裁定后再启用（若为同一总线则本站不得启用
# ——禁双 master 共总线）。同类的现场前置还有 RC-11（消防/空调若实际并接在 BMS 的
# 485-2 总线上 ⇒ 该站不得启用，须改由储能侧转发或重新布线）与 RC-4（BMS 主从方向，
# §9.10 Q-1：本配置按"MUPC 为主机、BMS 主控为从机、slave = 簇号"落位）。
# 【现场校准】下列各站 port/slave/baud_rate/parity 均为**预留值或示例值**，投运前须按现场
# 接线与设备实际核对/回写（RC-1 逐点比对含 BMS 116/186、ADL400 0x0092、BMS 2991–2994；
# RC-5/RC-10 消防登记数与探测器地址序；RC-6 空调校验位）。各站 addr 基准亦须现场裁定
# （RC-3，PCS 站尤甚）。
# ⚠️ 各站串口不得与 intercore.modbus_rtu（PCS 主链路 ttyS0）同口（RS485 总线
# 仲裁未实现，禁双 master 共总线）。
south_stations:
  poll_ms: 1000
  stale_timeout_s: 5
  stations:
    # ================= 1) 储能主控模块 BMS（FC04 遥测 + FC02 告警位）=================
    - id: bms
      role: battery
      port: "/dev/ttyS2"
      protocol: modbus
      slave: 1
      baud_rate: 9600            # 现场核对（§9.10 Q-2）
      parity: none
      interval_ms: 1000          # 须 <5000（配置期强校验）
      regs:
        - name: bms_io           # 100–130；_k ↔ 寄存器 99+k
          func: input
          addr: 100
          count: 31
          format: uint16
          scale: 1.0
          points:
            - { at: 1 }                                   # 100 簇电池簇状态（枚举）
            - { at: 2,  count: 6, scale: 0.1 }             # 101–106 允许充放功率/电压/电流
            - { at: 8,  count: 8 }                        # 107–114 主控 DI1–DI8
            - { at: 16, scale: 0.1 }                      # 115 簇组电压 V
            - { at: 17, format: uint16, scale: 0.1, offset: -1600.0 }  # 116 簇组电流 A（原文 UNIT=UINT）
            - { at: 18, format: uint16, scale: 1.0, offset: -40.0 }    # 117 簇组模块温度 ℃
            - { at: 19, name: soc }                       # 118 簇组 SOC（控制输入，点名契约）
            - { at: 20 }                                  # 119 簇组 SOH %
            - { at: 21 }                                  # 120 簇组绝缘电阻 kΩ
            - { at: 22, scale: 0.001 }                    # 121 簇平均单体电压 V
            - { at: 23, format: uint16, scale: 1.0, offset: -40.0 }    # 122 簇平均单体温度 ℃
            - { at: 24, scale: 0.001 }                    # 123 簇最高单体电压 V
            - { at: 25 }                                  # 124 最高单体电压对应点（整字，§9.10 Q-18）
            - { at: 26, scale: 0.001 }                    # 125 簇最低单体电压 V
            - { at: 27 }                                  # 126 最低单体电压对应点（整字）
            - { at: 28, format: uint16, scale: 1.0, offset: -40.0 }    # 127 簇最高单体温度 ℃
            - { at: 29 }                                  # 128 最高单体温度对应点（整字）
            - { at: 30, format: uint16, scale: 1.0, offset: -40.0 }    # 129 簇最低单体温度 ℃
            - { at: 31 }                                  # 130 最低单体温度对应点（整字）
        - name: bms_energy       # 139–157；_k ↔ 寄存器 138+k
          func: input
          addr: 139
          count: 19
          format: int32_scaled
          scale: 0.1
          points:
            - { at: 1 }                                   # 139–140 簇累计充电电量 kWh
            - { at: 3 }                                   # 141–142 簇累计放电电量
            - { at: 5 }                                   # 143–144 簇单次累计充电电量
            - { at: 7 }                                   # 145–146 簇单次累计放电电量
            - { at: 9 }                                   # 147–148 簇可充电量
            - { at: 11 }                                  # 149–150 簇可放电量
            - { at: 13, format: uint16, scale: 1.0 }      # 151 簇最高单体温升 ℃
            - { at: 15, format: uint16, scale: 0.001 }    # 153 簇最高单体最高电压变化 V
            - { at: 17, format: uint16, scale: 1.0, offset: -40.0 }   # 155 最高单体极柱温度 ℃
            - { at: 19, format: uint16, scale: 1.0, offset: -40.0 }   # 157 最低单体极柱温度 ℃
        - name: bms_meta         # 181–189；_k ↔ 寄存器 180+k
          func: input
          addr: 181
          count: 9
          format: uint16
          scale: 1.0
          points:
            - { at: 1 }                                   # 181 主控程序版本号
            - { at: 2 }                                   # 182 从控数量
            - { at: 3 }                                   # 183 簇组 SOE %
            - { at: 4 }                                   # 184 单体温度极差 ℃
            - { at: 5, scale: 0.001 }                     # 185 单体电压极差 V
            - { at: 6, format: uint16, scale: 0.1 }       # 186 簇实时充放电功率 kW
            - { at: 7, scale: 0.1 }                       # 187 PACK 组压最高电压 V
            - { at: 9, scale: 0.1 }                       # 189 PACK 组压最低电压 V（188 为对应点，不采）
        - name: bms_term         # 2991–2994 端子温度 001–004；整窗口产出 4 点
          func: input
          addr: 2991
          count: 4
          format: uint16         # 原文 UNIT=UINT
          scale: 1.0
          offset: -40.0
        - name: bms_cap          # 4000–4005；_k ↔ 寄存器 3999+k
          func: input
          addr: 4000
          count: 6
          format: uint16
          scale: 1.0
          points:
            - { at: 1 }                                   # 4000 簇累计充电容量 Ah
            - { at: 3 }                                   # 4002 簇累计放电容量 Ah
            - { at: 5 }                                   # 4004 簇单次累计充电容量 Ah
            - { at: 6 }                                   # 4005 簇单次累计放电容量 Ah
        - name: bms_alarm        # FC02 位块 200–487；_k ↔ 位地址 199+k
          func: discrete
          addr: 200
          count: 288
#    # ================= 2) 两级式 PCS（只读 3 区，FC04）=================
#    - id: pcs
#      role: pcs
#      port: "/dev/ttyS7"           # 建议值，待现场校准（§9.10 Q-15）
#      protocol: modbus
#      slave: 1                     # 拨码默认
#      baud_rate: 19200
#      parity: none
#      interval_ms: 1000            # 配置期下界 500ms
#      regs:
