# MUPC AI 引擎动态配置
# 对齐训练管线 v2.6 配置系统
# 版本: v2.6-20260611

version:
  fingerprint: "v3.0-20260621"
  source: "mupc-ai2"

# ═══════════════════════════════════════════════════════════════
# LSTM 模型架构配置 (v3.0)
# ═══════════════════════════════════════════════════════════════
lstm:
  input_features: 7               # 输入特征数 (默认 7, 对齐 MUPC-AI2 训练管线)
  yesterday_offset_steps: 96      # 昨日 PV 偏移步数 (= 24h / step_seconds)

physical:
  transformer_kva: 200.0
  battery_capacity_kwh: 100.0
  p_batt_max_kw: 50.0
  load_shed_max_kw: 60.0

safety:
  soc_min: 0.10
  soc_max: 0.90
  overload_threshold: 0.85

operational:
  p_batt_ramp_limit_kw: 50.0
  q_batt_ramp_limit_kvar: 30.0
  pv_limit_min: 0.10

reward_thresholds:
  q_margin_threshold: 0.10      # Q 裕度阈值，低于此值视为"无功耗尽"
  p_threshold_kw: 5.0           # P 阈值（kW），省电策略判定阈值