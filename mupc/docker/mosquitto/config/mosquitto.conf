# mosquitto.conf for local MQTT broker
# Phase 3B: 进程间通信

# 监听端口
listener 1883
protocol mqtt

# 允许匿名访问（本地环境）
allow_anonymous true

# 日志配置
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# 消息持久化
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
persistence_retention_ms 3600000

# 最大连接数（-1 表示无限制）
max_connections -1

# 消息大小限制
max_incoming_bytes 1MB
max_outgoing_bytes 1MB

# 心跳间隔
keepalive 60

# QoS 等级 0 的消息不持久化（内存中）
max_queued_messages 1000
