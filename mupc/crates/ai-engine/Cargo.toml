[package]
name = "mupc-ai-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio.workspace = true
async-trait = "0.1"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tracing.workspace = true
chrono.workspace = true
sha2 = "0.10"
futures = "0.3"
rand = "0.8"
mupc_storage = { path = "../storage" }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "macros"] }
rustfft = "6.2"
nalgebra = "0.33"

[dev-dependencies]
tokio-test = "0.4"

[features]
# ⚠️ **npu 是显式开关，不做默认**：`cargo --workspace` 类命令会把**每个成员自身的
# default features** 打开（与依赖方是否 `default-features = false` 无关）⇒ 只要这里是
# `default = ["npu"]`，CI 的 test/lint job（x86_64）就会去链接 aarch64 的 librknnrt.so
# 而结构性不可跑。开启方式（均已带 `--features npu`）：CI build job /
# `deploy/scripts/build-for-rk3588.sh --cross` / CMake 的 ENABLE_NPU。
default = []
npu = []

[build-dependencies]
sha2 = "0.10"