[package]
name = "mupc-ai-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio.workspace = true
async-trait = "0.1"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tracing.workspace = true
chrono.workspace = true
sha2 = "0.10"
futures = "0.3"
rand = "0.8"
mupc_storage = { path = "../storage" }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "macros"] }
rustfft = "6.2"
nalgebra = "0.33"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["npu"]
npu = []

[build-dependencies]
sha2 = "0.10"