[package]
name = "mupc-iec61850-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
device-trait = { path = "../device-trait" }
tokio.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
mupc-core = { path = "../core" }
mupc-security = { path = "../security" }
async-trait.workspace = true
parking_lot = "0.12"
chrono.workspace = true

# MMS 协议栈 (libIEC61850 FFI 绑定)
iec61850 = { version = "0.1.0", optional = true }

# TLS 支持
rustls = "0.23"
webpki-roots = "0.26"

[dev-dependencies]
tokio-test = "0.4"

[lib]
crate-type = ["rlib", "cdylib"]
name = "iec61850_plugin"
path = "src/lib.rs"

[features]
default = ["fake_iec61850"]
real_iec61850 = ["dep:iec61850"]
fake_iec61850 = []