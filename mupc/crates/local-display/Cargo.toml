# 12-MUPC 本地显示终端 —— 渲染端库（局部第 4 块 Dev-B4）
#
# 命名对齐：目录 crates/local-display（与 display-proto/rs485-plugin 同风格），
# lib target = mupc_local_display（对齐设计 §5.1 表 `crates/local-display`（`mupc_local_display`））。
#
# 职责（对齐 `[DESIGN_APPROVED]` 设计 §5.1/§5.2/§5.4/§6）：
#   - channel：DisplayChannelClient（127.0.0.1 回环 GET /v1/display/latest；**非阻塞状态机**）
#   - state：DisplayState + 三态归一纯逻辑（新鲜度/通道态/NumView）+ ControlState
#   - canvas：Canvas trait + OffscreenCanvas + Linux FbCanvas(/dev/fb0 mmap)（升为 flush sink）
#   - screen：flush_cb 的像素 sink（MemorySink / FbCanvas）+ Blitter 脏区搬运
#   - config：渲染进程 CLI 参数解析 + 校验（设计 §7.2；手写解析，不引 clap）
#   - 【v2.0 工作单元 C】timing：事件循环骨架（poll 唯一阻塞点 + lv_timer_handler 驱动，§5.2）
#   - 【v2.0 工作单元 C】touch：evdev 触摸栈（纯逻辑全平台可测；evdev 部分 cfg(linux)，§1.2）
#   - 【v2.0 工作单元 B3-1】console：控制通道非阻塞状态机（/v1/console/*，幂等重试）
#   - 【v2.0 工作单元 B3-2a】app：LVGL 会话 + 六页外壳 + 通道状态机的装配层（§5.2）+ `--smoke`
#   - main（bin mupc-local-display）：CLI → 装配 → 事件循环 → 优雅退出（设计 §5.1/§9）
#   - 【v2.0 已删除】font（ab_glyph 光栅化）/ layout（固定网格自绘）/ run（定时自绘循环）
# 依赖刻意保持最小（设计 §5.1）：仅 display-proto 所需 —— 不引入 serde_yaml / HTTP 服务栈。
# 通道 GET 用**裸 `std::net::TcpStream`** + HTTP/1.1 手写最小请求（无 reqwest/ureq 依赖），
# 并由 `tick` 以非阻塞状态机推进（§5.5）⇒ **tokio 已随 v1.0 的 async 通道客户端一并移除**
# （B3-2a：全 crate 零 `async`/`block_on`；事件循环是 `timing::run` 的单线程同步循环）。
# 字体：ab_glyph 依赖亦随 `font.rs` 移除 —— 中文上屏改由 LVGL 位图字库承担（见 `noto-font`）。
#
# [features]
#   ⚠️ v1.0 的 `bundled-font` feature 已**整体删除**（它唯一的消费者 `font.rs` 已废弃）：
#      构建脚本若仍传 `--features bundled-font` 会**响亮失败**（"package does not contain
#      this feature"），而不是静默编出一个"没捆绑字库"的产物。
[package]
name = "local-display"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MUPC 本地显示终端渲染端库：通道客户端（非阻塞）/三态归一/LVGL 六页外壳与事件循环装配/离屏+帧缓冲像素 sink（12-MUPC v2.0）"

[lib]
name = "mupc_local_display"

# 进程层入口（设计 §5.1：local-display = lib + bin；bin 名对齐部署产物
# /opt/mupc/bin/mupc-local-display，设计 §11.2）。
[[bin]]
name = "mupc-local-display"
path = "src/main.rs"

[features]
default = []
# 【LVGL 链路】转发到 lvgl-sys 的 `noto-font`：启用后 `lvgl::font::Font::of(档位)`
# 取到 `lv_font_conv` 生成的 CJK 位图字体（10 档，设计 §1.1.2）。
# ⚠️ 前置：先跑 `fonts/gen_fonts.sh` 生成 `fonts/lv_font_noto_sc_*.c`（产物不入库）；
#    产物缺失时 lvgl-sys 的 build.rs 给出可读的编译期报错（不退化为链接错误）。
# 未启用（默认）时 `Font::of(..)` 一律返回 `None`（降级路径），`Font::fallback()`
# 始终可用 —— 见 src/lvgl/font.rs 模块文档。
noto-font = ["lvgl-sys/noto-font"]

[dependencies]
display-proto = { path = "../display-proto" }
# LVGL v9 C 源码的原始（unsafe）绑定。**只允许**被 `src/lvgl/**` 薄安全层引用
# （设计 §1.1.1.2 unsafe 边界纪律 1：`pages`/`state`/`channel` 等模块不得直接 use）。
lvgl-sys = { path = "lvgl-sys" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# 控制通道的 `request_id` = **UUID v4**（幂等键兼防重放凭据，设计 §3.3/§5.5）。
# 工作区已有 `uuid`（根 Cargo.toml，features = ["v4","serde"]）—— 本单元唯一新增的依赖行；
# **不得**用计数器 / 时间戳自制"伪 uuid"：弱 id 会把两次不同操作误判为同一请求（静默丢操作）。
uuid = { workspace = true }

# /dev/fb0 mmap 与 evdev 读取仅在 Linux 需要（Windows 本机不编译这两个 cfg 块
# ——设计 §B1/§11.2：evdev 发现与校准属真机项，其**判定逻辑**（touch.rs 上半）全平台可测）。
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# 触摸栈（设计 §1.2 关键决策 B-1 **选定**）：直接 ioctl/read，不引入 libevdev
# （`lv_conf.h` 的 `LV_USE_EVDEV = 0`）。仅在 Linux target 编译。
evdev = "0.13"
