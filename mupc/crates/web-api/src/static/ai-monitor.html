<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUPC AI 安全监控面板</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --green: #22c55e; --red: #ef4444; --yellow: #eab308; --blue: #3b82f6; --border: #334155; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
  h1 { font-size: 1.5rem; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card h3 { font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .card .value { font-size: 1.8rem; font-weight: 700; }
  .status-safe { color: var(--green); }
  .status-warn { color: var(--yellow); }
  .status-danger { color: var(--red); }
  .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .config-item { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .config-item label { font-size: 0.75rem; color: #64748b; display: block; }
  .config-item span { font-size: 1.1rem; font-weight: 600; }
  .violation-list { max-height: 320px; overflow-y: auto; }
  .violation-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
  .violation-item .time { color: #94a3b8; margin-right: 8px; }
  .violation-item .reason { color: var(--red); }
  .violation-item .detail { color: #64748b; font-size: 0.8rem; margin-top: 4px; }
  .alert-banner { background: var(--red); color: white; padding: 12px 20px; border-radius: 8px; margin-bottom: 16px; display: none; font-weight: 600; }
  .alert-banner.visible { display: block; }
  .refresh-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .refresh-bar button { background: var(--blue); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .refresh-bar span { color: #64748b; font-size: 0.8rem; }
</style>
</head>
<body>

<h1>MUPC AI 安全监控面板</h1>

<div class="alert-banner" id="alertBanner">
  ⚠️ 拒绝率超过 20%，建议检查台区运行状态
</div>

<div class="refresh-bar">
  <span id="lastUpdate">最后更新：--</span>
  <button onclick="refreshAll()">⇄ 立即刷新</button>
</div>

<div class="grid">
  <div class="card">
    <h3>当前安全状态</h3>
    <div class="value" id="safetyStatus">--</div>
  </div>
  <div class="card">
    <h3>拒绝率</h3>
    <div class="value" id="rejectionRate">--</div>
  </div>
  <div class="card">
    <h3>平均延迟</h3>
    <div class="value" id="avgLatency">--</div>
  </div>
</div>

<div class="card" style="margin-bottom: 24px;">
  <h3>安全边界配置</h3>
  <div class="config-grid" id="configGrid"></div>
</div>

<div class="card" style="margin-bottom: 24px;">
  <h3>最近违规记录</h3>
  <div class="violation-list" id="violationList">
    <div style="color: #64748b;">暂无违规记录</div>
  </div>
</div>

<script>
const API_BASE = '/api/v1/safety_wrapper';
const SSE_URL = '/api/v1/ai/stream?types=safety_wrapper';

async function refreshAll() {
  try {
    const res = await fetch(`${API_BASE}/status`);
    const data = await res.json();
    updateUI(data);
    document.getElementById('lastUpdate').textContent = '最后更新：' + new Date().toLocaleTimeString('zh-CN');
  } catch (e) {
    console.error('刷新失败:', e);
  }
}

function updateUI(data) {
  const rejectionRate = (data.rejection_rate * 100).toFixed(1) + '%';
  const statusEl = document.getElementById('safetyStatus');
  const banner = document.getElementById('alertBanner');

  if (data.total_rejected === 0) {
    statusEl.textContent = '✅ 安全';
    statusEl.className = 'value status-safe';
  } else if (data.rejection_rate < 0.20) {
    statusEl.textContent = '⚠️ 有拒绝';
    statusEl.className = 'value status-warn';
  } else {
    statusEl.textContent = '🚨 告警';
    statusEl.className = 'value status-danger';
    banner.classList.add('visible');
  }

  document.getElementById('rejectionRate').textContent = rejectionRate;
  document.getElementById('avgLatency').textContent = (data.avg_latency_us / 1000).toFixed(2) + ' ms';

  const configGrid = document.getElementById('configGrid');
  configGrid.innerHTML = [
    ['电压下限', data.v_min + ' p.u.'],
    ['电压上限', data.v_max + ' p.u.'],
    ['dv/dt 上限', data.dv_dt_max + ' p.u./s'],
    ['SOC 裕度', (data.soc_margin * 100).toFixed(0) + '%'],
    ['线路电阻', data.line_impedance_r_ohm + ' Ω'],
    ['线路电抗', data.line_impedance_x_ohm + ' Ω'],
    ['基准电压', data.v_base + 'V'],
    ['总检查次数', data.total_checks],
    ['总拒绝次数', data.total_rejected],
    ['最大延迟', (data.max_latency_us / 1000).toFixed(2) + ' ms'],
  ].map(([label, value]) =>
    `<div class="config-item"><label>${label}</label><span>${value}</span></div>`
  ).join('');
}

// SSE 订阅实时事件（push 模式，无轮询开销）
let eventSource;
function connectSSE() {
  eventSource = new EventSource(SSE_URL);
  eventSource.addEventListener('safety_wrapper', function(e) {
    try {
      const data = JSON.parse(e.data);
      const list = document.getElementById('violationList');
      const item = document.createElement('div');
      item.className = 'violation-item';
      item.innerHTML = `
        <span class="time">${new Date().toLocaleTimeString('zh-CN')}</span>
        <span class="reason">${data.reason || data.check_result}</span>
        <div class="detail">v_predicted=${(data.v_predicted || 0).toFixed(3)} | latency=${(data.latency_us || 0) / 1000}ms</div>
      `;
      list.insertBefore(item, list.firstChild);
      // 保持最多 20 条
      while (list.children.length > 21) list.removeChild(list.lastChild);
    } catch (err) { console.error('SSE parse error:', err); }
  });
  eventSource.onerror = function() {
    eventSource.close();
    setTimeout(connectSSE, 5000);
  };
}

refreshAll();
setInterval(refreshAll, 5000);
connectSSE();
</script>
</body>
</html>
