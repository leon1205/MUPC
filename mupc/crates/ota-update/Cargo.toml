[package]
name = "mupc-ota-update"
version = "0.1.0"
edition = "2021"
description = "OTA model automatic update module for MUPC"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
reqwest = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"