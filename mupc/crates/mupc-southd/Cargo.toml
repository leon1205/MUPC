[package]
name = "mupc-southd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
async-trait = "0.1"
chrono.workspace = true
rs485-plugin = { path = "../rs485-plugin" }
mupc-data-processing = { path = "../data-processing" }

[dev-dependencies]
# YAML 解析仅测试用：lib 不做配置解析（真实解析在 mupc-core-bin）
serde_yaml = "0.9"
# 测试缝：southd 的集成测试（tests/*.rs）需要驱动 rs485-plugin 的
# 帧级交换缝（见 rs485-plugin 的 `test-seam` feature 注释）。
# 仅 dev-dependencies ⇒ 生产构建（cargo build）不开此 feature。
rs485-plugin = { path = "../rs485-plugin", features = ["test-seam"] }
