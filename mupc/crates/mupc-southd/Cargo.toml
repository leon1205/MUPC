# ⚠️ crate 名带 `d` 但**没有自有守护进程入口**：本 crate 是**库形态，内嵌在 mupcd 主控进程**里
# （站级南向调度 + PCS 通信与控制由主控进程装配，见 02 号设计 §13 / ADR-014）。唯一的 bin
# `pcs_slave` 是 feature 门控（`pcs-slave-bin`）、默认不构建的**联调工具**，不是产线进程。
# 命名沿革：早期曾按「独立 southd 守护进程」规划，迁入方案落地后改为内嵌形态（审查 E-14）。
[package]
name = "mupc-southd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# PCS 从站仿真 bin 的依赖开关：联调工具（虚拟串口对 / USB-RS485 回环），
# **默认不构建** —— 产线 `cargo build -p mupc-southd` 不编它、不拉 tokio-serial。
# 用法：cargo run -p mupc-southd --features pcs-slave-bin --bin pcs_slave -- <port> [baud] [slave]
#
# 为什么不放 [dev-dependencies]：Cargo 的 dev-dependencies **只对 tests / examples /
# benches 生效，`[[bin]]` 拿不到**（实测 `cargo build --bin pcs_slave` 报
# `unresolved import tokio_serial`，E0432）⇒ 只能 feature 门控 + optional 依赖。
pcs-slave-bin = ["dep:tokio-serial"]

[dependencies]
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
async-trait = "0.1"
chrono.workspace = true
rs485-plugin = { path = "../rs485-plugin" }
mupc-data-processing = { path = "../data-processing" }
# 仅 bin/pcs_slave（feature `pcs-slave-bin`）需要；产线构建不引入。
tokio-serial = { version = "5.4", optional = true }

[[bin]]
name = "pcs_slave"
path = "src/bin/pcs_slave.rs"
# 联调工具不进产线默认构建（与 bin 内 tokio-serial 的可选依赖同一开关）
required-features = ["pcs-slave-bin"]

[dev-dependencies]
# YAML 解析仅测试用：lib 不做配置解析（真实解析在 mupc-core-bin）
serde_yaml = "0.9"
# 测试缝：southd 的集成测试（tests/*.rs）需要驱动 rs485-plugin 的
# 帧级交换缝（见 rs485-plugin 的 `test-seam` feature 注释）。
# 仅 dev-dependencies ⇒ 生产构建（cargo build）不开此 feature。
rs485-plugin = { path = "../rs485-plugin", features = ["test-seam"] }
# tokio 的 test-util：`tests/pcs_e2e.rs` 的 E7（采集定时循环）用**假时钟**
# （`#[tokio::test(start_paused = true)]` + `tokio::time::advance`）确定性驱动，
# 不用真实 sleep（后者 flaky）。test-util **不在** tokio 的 `full` 里 —— 必须显式开。
# 仅 dev-dependencies ⇒ 产线构建不拉（[dependencies] 的 tokio 不动）。
tokio = { workspace = true, features = ["test-util", "macros"] }
