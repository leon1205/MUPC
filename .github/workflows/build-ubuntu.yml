name: Build Ubuntu 22.04 ARM64

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Job 1: 代码检查 (x86_64 本机, 快速) ──
  lint:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: mupc
    steps:
      - uses: actions/checkout@v4
        with:
          # `mupc/vendor/lvgl` 是 submodule（pin v9.5.0）。缺此步 ⇒ 目录为空 ⇒
          # lvgl-sys 的 build.rs 无 C 源可编（本 job 因此**结构性无法通过**）。
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # clippy 覆盖全 workspace ⇒ 会跑 lvgl-sys 的 build.rs（bindgen）⇒ 需 libclang。
      - name: Install libclang (for lvgl-sys bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      # 显式指路：clang-sys 会自己找，但版本随镜像变化，给出来更稳（与 hmi job 同款）。
      - name: Point bindgen at libclang
        run: |
          lib=$(find /usr/lib/llvm-* /usr/lib/x86_64-linux-gnu -name 'libclang.so*' 2>/dev/null | head -1)
          test -n "$lib" || { echo "ERROR: 未找到 libclang.so"; exit 1; }
          echo "LIBCLANG_PATH=$(dirname "$lib")" >> "$GITHUB_ENV"
          echo "libclang = $lib"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mupc/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('mupc/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (no npu)
        run: cargo clippy --workspace -- -D warnings

  # ── Job 2: 测试 (x86_64 本机, no npu) ──
  test:
    runs-on: ubuntu-22.04
    needs: lint
    defaults:
      run:
        working-directory: mupc
    steps:
      - uses: actions/checkout@v4
        with:
          # 同 lint job：lvgl-sys 需要 `vendor/lvgl` 的 C 源。
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libclang (for lvgl-sys bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Point bindgen at libclang
        run: |
          lib=$(find /usr/lib/llvm-* /usr/lib/x86_64-linux-gnu -name 'libclang.so*' 2>/dev/null | head -1)
          test -n "$lib" || { echo "ERROR: 未找到 libclang.so"; exit 1; }
          echo "LIBCLANG_PATH=$(dirname "$lib")" >> "$GITHUB_ENV"
          echo "libclang = $lib"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('mupc/Cargo.lock') }}

      - name: Run tests (no npu, exclude known failures)
        run: |
          cargo test --workspace \
            --exclude mupc-iec61850-plugin \
            --exclude rs485-plugin \
            --exclude device-trait

  # ── Job 3: ARM64 交叉编译 + 产物上传 ──
  build:
    runs-on: ubuntu-22.04
    needs: test
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
    defaults:
      run:
        working-directory: mupc

    steps:
      - uses: actions/checkout@v4
        with:
          # 本 job 只编 mupc-core-bin，但保持与其它 job 一致的检出形态
          # （submodule pin 是仓库状态的一部分；HMI 的交叉编译见 `hmi` job）。
          submodules: recursive

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Setup RKNN SDK
        run: |
          mkdir -p vendor/rknn
          # 默认无 NPU
          echo "BUILD_NO_NPU=1" >> $GITHUB_ENV
          # 优先使用 GitHub Secrets 中的 base64 编码 .so
          if [ -n "$RKNN_SO_B64" ]; then
            echo "$RKNN_SO_B64" | base64 -d > vendor/rknn/librknnrt.so
            # ⚠️ `crates/ai-engine/build.rs` 对 `vendor/rknn/librknnrt.so` 做 SHA256 校验，
            # 且**首次导入时缺 `.sha256` 会直接 panic**（防篡改闸门）⇒ 本步必须一并写出该
            # 文件，否则 `--features npu` 的构建在干净 runner 上**必定失败**
            # （构建 job 的缓存只含 ~/.cargo，不含 vendor/，重跑也一样）。
            if [ -n "$RKNN_SO_SHA256" ]; then
              echo "$RKNN_SO_SHA256  librknnrt.so" > vendor/rknn/librknnrt.so.sha256
              echo "[RKNN] 期望哈希来自 secrets.RKNN_SO_SHA256（可校验来源真实性）"
            else
              sha256sum vendor/rknn/librknnrt.so > vendor/rknn/librknnrt.so.sha256
              echo "WARNING: 未提供 secrets.RKNN_SO_SHA256 ⇒ 只能校验文件未损坏，无法校验来源真实性"
            fi
            cat vendor/rknn/librknnrt.so.sha256
            echo "BUILD_NO_NPU=0" >> $GITHUB_ENV
          elif [ -f vendor/rknn/librknnrt.so ]; then
            echo "BUILD_NO_NPU=0" >> $GITHUB_ENV
          else
            echo "WARNING: librknnrt.so not found. Building without npu feature."
          fi
        env:
          RKNN_SO_B64: ${{ secrets.RKNN_SO_B64 }}
          RKNN_SO_SHA256: ${{ secrets.RKNN_SO_SHA256 }}

      - name: Cache cross cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cross-${{ matrix.target }}-${{ hashFiles('mupc/Cargo.lock') }}

      - name: Build ARM64 release (with npu)
        if: env.BUILD_NO_NPU == '0'
        run: |
          cross build -p mupc-core-bin --release --target ${{ matrix.target }} --features npu

      - name: Build ARM64 release (no npu)
        if: env.BUILD_NO_NPU == '1'
        run: |
          cross build -p mupc-core-bin --release --target ${{ matrix.target }}

      - name: Verify artifacts
        run: |
          echo "=== mupcd binary ==="
          if [ ! -f target/${{ matrix.target }}/release/mupcd ]; then
            echo "ERROR: mupcd binary not found at target/${{ matrix.target }}/release/mupcd"
            exit 1
          fi
          file target/${{ matrix.target }}/release/mupcd
          echo "=== Plugin .so files ==="
          find target/${{ matrix.target }}/release/ -name "*.so" -exec file {} \;

      - name: Upload artifacts (master branch)
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: mupc-ubuntu2204-arm64-latest
          path: |
            mupc/target/${{ matrix.target }}/release/mupcd
            mupc/target/${{ matrix.target }}/release/*.so
            mupc/config/
            mupc/deploy/

      - name: Upload artifacts (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: mupc-ubuntu2204-arm64-${{ github.ref_name }}
          path: |
            mupc/target/${{ matrix.target }}/release/mupcd
            mupc/target/${{ matrix.target }}/release/*.so
            mupc/config/
            mupc/deploy/

  # ── Job 4: 本地显示终端（HMI / LVGL）交叉编译门禁 ──────────────────────────────
  # 依据：设计 §12.1「构建」/ §14 R-20 / R-23 —— 设计把
  #   `cargo build --target aarch64-unknown-linux-gnu -p lvgl-sys`
  # 列为**实施第一步门禁**，而此前 CI 的 build job **只编 mupc-core-bin**，
  # 从不编译 local-display / lvgl-sys ⇒ 全部 `#[cfg(target_os="linux")]` 代码
  # （FbCanvas 的 fb0 映射与像素格式探测 / FdPoller / evdev 触摸 / 信号处理）
  # **一次都没过编译器**。
  #
  # ✅ 验证状态（2026-09-19，Linux 构建机手跑，步骤与本 job 逐条对齐）：
  #   1. `cargo build -p lvgl-sys --target aarch64-unknown-linux-gnu` 通过（1m28s）；
  #   2. `cargo build -p local-display --release --features noto-font --target
  #      aarch64-unknown-linux-gnu` 通过，产物经 `file` 验为 ARM aarch64
  #      （解释器 /lib/ld-linux-aarch64.so.1）；
  #   3. 首跑确如预期**红了 27 处**，已逐条修掉（详见 `docs/technical-debt.md` §8.6
  #      L-1）——根因不是 CI 语义，而是**代码从未在 Linux 上编译过**：
  #      `lv_event_code_t` 在 Linux 上由 bindgen 生成为 `c_uint`、Windows 上为 `i32`，
  #      而 `event.rs` 写死了 `i32`；`touch.rs` 的 `#[cfg(target_os="linux")] mod linux`
  #      漏引入 `select_index`。
  # ⇒ 本 job 自此为**硬门禁**：它红了就是真结论，不再有"未验证"豁免。
  #   仓库设置侧：需在 master 的分支保护里把本 job（check 名 = job id `hmi`）加为
  #   required status check —— 步骤与 check 名清单见 `mupc/build.md` §分支保护配置。
  #
  # 无 `needs:` —— 有意与 lint/test 并行：lint 若因 Linux 侧问题变红，本 job 仍能
  # 独立给出 HMI 的编译结论（这正是当前最需要的信号）。
  hmi:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: mupc
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      # 交叉 bindgen 的 sysroot 处置（设计 §12.1 ③ 的处置 ①）：clang 需目标 libc 头；
      # `gcc-aarch64-linux-gnu` 会带来 /usr/aarch64-linux-gnu/include。
      BINDGEN_EXTRA_CLANG_ARGS: -isystem /usr/aarch64-linux-gnu/include
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain + aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      # 字库由 `lv_font_conv`（npx）生成；需要 node。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cross C toolchain + libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libclang-dev

      - name: Point bindgen at libclang
        run: |
          lib=$(find /usr/lib/llvm-* /usr/lib/x86_64-linux-gnu -name 'libclang.so*' 2>/dev/null | head -1)
          test -n "$lib" || { echo "ERROR: 未找到 libclang.so"; exit 1; }
          echo "LIBCLANG_PATH=$(dirname "$lib")" >> "$GITHUB_ENV"
          echo "libclang = $lib"

      # 字库源（OFL-1.1）与生成物（.c）**都不入库**（设计 §1.1.2 / 仓库 .gitignore）
      # ⇒ CI 必须先把 .otf 取下来，否则 gen_fonts.sh 会以 exit 1 拒绝运行。
      - name: Fetch font source (not in repo by design)
        working-directory: mupc/crates/local-display/fonts
        run: |
          curl -fL -o NotoSansSC-Regular.otf \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
          ls -l NotoSansSC-Regular.otf

      # 约 1–2 分钟（10 档 × 全码表）。注意：本脚本会**覆写**两个入库派生清单
      # （lv_font_cmap.txt / lv_font_metrics.txt）——CI 不提交，且输入码表未变时
      # 产物与入库清单一致（漂移检测仍成立）。
      - name: Generate bitmap fonts (10 tiers)
        working-directory: mupc/crates/local-display/fonts
        # 执行位已根治（2026-09-19，`git update-index --chmod=+x` ⇒ 模式位 100755，
        # 见 `docs/technical-debt.md` §8.6 L-2）⇒ 直接 `./` 调用即可。
        run: ./gen_fonts.sh

      # ── 门禁（设计要求"先单独跑通 sys 层"）：一条命令暴露交叉 bindgen 的全部问题 ──
      - name: Gate - cross-build lvgl-sys alone
        run: cargo build -p lvgl-sys --target aarch64-unknown-linux-gnu

      - name: Cross-build HMI binary (release, with fonts)
        run: |
          cargo build -p local-display --release --features noto-font \
            --target aarch64-unknown-linux-gnu

      - name: Verify artifact
        run: |
          f=target/aarch64-unknown-linux-gnu/release/mupc-local-display
          test -f "$f" || { echo "ERROR: $f 不存在"; exit 1; }
          file "$f"
